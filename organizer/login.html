<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Organizer Login | VJTI Cricket Ops</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body class="bg-[#050807] text-white min-h-[100svh] flex items-center justify-center p-4">
  <div class="glass-panel p-8 max-w-md w-full border-white/10 text-center">
    <div class="w-14 h-14 mx-auto rounded-full bg-white p-1.5 flex items-center justify-center border border-white/20 mb-4 overflow-hidden">
      <img src="/brand/vjti-logo.png" alt="VJTI Logo" class="w-full h-full object-contain rounded-full" width="48" height="48" />
    </div>
    <span class="font-mono text-xs uppercase tracking-widest text-[#31D47B]">Authorized Personnel Only</span>
    <h1 class="font-display text-3xl font-black text-[#F4F1E8] mt-1 mb-6">VJTI CRICKET OPS</h1>
    
    <form id="org-login-form" class="space-y-4 text-left">
      <div>
        <label class="block font-mono text-xs text-[#A7B2AC] uppercase mb-1">Email</label>
        <input type="email" required class="w-full bg-[#07100B] border border-white/10 rounded-lg p-3 text-white focus:border-[#31D47B] outline-none" placeholder="organizer@vjti.ac.in" />
      </div>
      <div>
        <label class="block font-mono text-xs text-[#A7B2AC] uppercase mb-1">Password</label>
        <input type="password" required class="w-full bg-[#07100B] border border-white/10 rounded-lg p-3 text-white focus:border-[#31D47B] outline-none" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn-primary w-full py-3 mt-4">AUTHENTICATE →</button>
    </form>

    <button id="forgot-password-link" type="button" class="mt-4 font-mono text-xs text-[#31D47B] hover:text-[#31D47B]/80 transition-colors">
      Forgot Password?
    </button>

    <a href="/" class="block mt-6 font-mono text-xs text-[#64716A] hover:text-white">← Return to public site</a>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-password-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass-panel p-8 max-w-md w-full border-white/10">
      <h2 class="font-display text-2xl font-black text-[#F4F1E8] mb-2">Reset Password</h2>
      <p class="text-sm text-[#A7B2AC] mb-6">Enter your admin email to receive a verification code.</p>
      
      <form id="forgot-password-form" class="space-y-4">
        <div>
          <label class="block font-mono text-xs text-[#A7B2AC] uppercase mb-1">Email</label>
          <input type="email" id="reset-email" required class="w-full bg-[#07100B] border border-white/10 rounded-lg p-3 text-white focus:border-[#31D47B] outline-none" placeholder="admin@vjti.ac.in" />
        </div>
        <div class="flex gap-3">
          <button type="button" id="close-forgot-modal" class="flex-1 px-4 py-3 text-sm font-mono text-[#A7B2AC] hover:text-white border border-white/10 rounded-lg hover:bg-white/5 transition-all">
            Cancel
          </button>
          <button type="submit" class="flex-1 btn-primary py-3">Send Code</button>
        </div>
      </form>
    </div>
  </div>

  <!-- OTP Verification Modal -->
  <div id="otp-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass-panel p-8 max-w-md w-full border-white/10">
      <h2 class="font-display text-2xl font-black text-[#F4F1E8] mb-2">Verify Code</h2>
      <p class="text-sm text-[#A7B2AC] mb-6">Enter the 6-digit code sent to <span id="otp-email" class="text-[#31D47B]"></span></p>
      
      <form id="otp-form" class="space-y-4">
        <div>
          <label class="block font-mono text-xs text-[#A7B2AC] uppercase mb-1">Verification Code</label>
          <input type="text" id="otp-code" required maxlength="6" pattern="[0-9]{6}" class="w-full bg-[#07100B] border border-white/10 rounded-lg p-3 text-white text-center text-2xl tracking-widest font-mono focus:border-[#31D47B] outline-none" placeholder="000000" />
        </div>
        <div class="relative">
          <label class="block font-mono text-xs text-[#A7B2AC] uppercase mb-1">New Password</label>
          <input type="password" id="new-password" required minlength="8" class="w-full bg-[#07100B] border border-white/10 rounded-lg p-3 pr-10 text-white focus:border-[#31D47B] outline-none" placeholder="Min. 8 characters" />
          <button type="button" class="password-toggle absolute right-3 top-[38px] text-[#A7B2AC] hover:text-white transition-colors" onclick="
            const input = this.previousElementSibling;
            if (input.type === 'password') {
              input.type = 'text';
              this.innerHTML = '<svg class=\'w-5 h-5\' fill=\'none\' stroke=\'currentColor\' viewBox=\'0 0 24 24\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21\' /></svg>';
            } else {
              input.type = 'password';
              this.innerHTML = '<svg class=\'w-5 h-5\' fill=\'none\' stroke=\'currentColor\' viewBox=\'0 0 24 24\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M15 12a3 3 0 11-6 0 3 3 0 016 0z\' /><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z\' /></svg>';
            }
          ">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <div class="flex gap-3">
          <button type="button" id="close-otp-modal" class="flex-1 px-4 py-3 text-sm font-mono text-[#A7B2AC] hover:text-white border border-white/10 rounded-lg hover:bg-white/5 transition-all">
            Cancel
          </button>
          <button type="submit" class="flex-1 btn-primary py-3">Reset Password</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/js/organizer/login.js"></script>
</body>
</html>
