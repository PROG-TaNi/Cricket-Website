<!-- Easter egg: Click logo/title 10 times to access admin -->
<script>
  (function() {
    const logoTitle = document.getElementById('footer-logo-title');
    if (!logoTitle) return;
    
    let clickCount = 0;
    let resetTimer = null;
    
    const handleClick = () => {
      clickCount++;
      
      // Clear any existing reset timer
      if (resetTimer) {
        clearTimeout(resetTimer);
      }
      
      // Add subtle visual feedback
      logoTitle.style.transform = 'scale(0.95)';
      setTimeout(() => {
        logoTitle.style.transform = 'scale(1)';
      }, 100);
      
      // Check if reached 10 clicks
      if (clickCount >= 10) {
        // Redirect to admin login
        window.location.href = '/organizer/login.html';
      } else {
        // Reset counter after 3 seconds of inactivity
        resetTimer = setTimeout(() => {
          clickCount = 0;
        }, 3000);
      }
    };
    
    // Add smooth transition for visual feedback
    logoTitle.style.transition = 'transform 0.1s ease';
    
    // Handle both click and keyboard activation
    logoTitle.addEventListener('click', handleClick);
    logoTitle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleClick();
      }
    });
  })();
</script>
