<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Left Floodlight Volumetric Beam -->
    <linearGradient id="leftBeam" x1="0%" y1="0%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#31D47B" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#159957" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050807" stop-opacity="0" />
    </linearGradient>

    <!-- Right Floodlight Volumetric Beam -->
    <linearGradient id="rightBeam" x1="100%" y1="0%" x2="30%" y2="90%">
      <stop offset="0%" stop-color="#31D47B" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#159957" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050807" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="30%" stop-color="#31D47B" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0F6B3D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050807" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left Floodlight Volumetric Cones -->
  <polygon points="260,220 220,240 850,1100 1200,1050" fill="url(#leftBeam)" />
  <polygon points="260,220 300,220 1400,1200 950,1250" fill="url(#leftBeam)" opacity="0.6" />

  <!-- Right Floodlight Volumetric Cones -->
  <polygon points="2140,220 2180,240 1550,1100 1200,1050" fill="url(#rightBeam)" />
  <polygon points="2140,220 2100,220 1000,1200 1450,1250" fill="url(#rightBeam)" opacity="0.6" />

  <!-- Left Floodlight Tower Structure -->
  <g stroke="#1a2e22" stroke-width="3" fill="none">
    <line x1="260" y1="220" x2="220" y2="700" />
    <line x1="260" y1="220" x2="300" y2="700" />
    <line x1="220" y1="350" x2="300" y2="350" />
    <line x1="220" y1="500" x2="300" y2="500" />
    <line x1="220" y1="350" x2="300" y2="500" />
    <line x1="300" y1="350" x2="220" y2="500" />
  </g>
  <!-- Left Bank of Lamps (4x4 Grid) -->
  <rect x="220" y="170" width="80" height="50" rx="4" fill="#0B120E" stroke="#31D47B" stroke-width="2" />
  <circle cx="260" cy="195" r="70" fill="url(#lampGlow)" />
  <circle cx="260" cy="195" r="14" fill="#FFFFFF" />

  <!-- Right Floodlight Tower Structure -->
  <g stroke="#1a2e22" stroke-width="3" fill="none">
    <line x1="2140" y1="220" x2="2100" y2="700" />
    <line x1="2140" y1="220" x2="2180" y2="700" />
    <line x1="2100" y1="350" x2="2180" y2="350" />
    <line x1="2100" y1="500" x2="2180" y2="500" />
    <line x1="2100" y1="350" x2="2180" y2="500" />
    <line x1="2180" y1="350" x2="2100" y2="500" />
  </g>
  <!-- Right Bank of Lamps -->
  <rect x="2100" y="170" width="80" height="50" rx="4" fill="#0B120E" stroke="#31D47B" stroke-width="2" />
  <circle cx="2140" cy="195" r="70" fill="url(#lampGlow)" />
  <circle cx="2140" cy="195" r="14" fill="#FFFFFF" />
</svg>
