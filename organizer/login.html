<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Organizer Login | VJTI Cricket Ops</title>
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body class="bg-[#050807] text-white min-h-[100svh] flex items-center justify-center p-4">
  <div class="glass-panel p-8 max-w-md w-full border-white/10 text-center">
    <div class="w-14 h-14 mx-auto rounded-full bg-white p-1.5 flex items-center justify-center border border-white/20 mb-4 overflow-hidden">
      <img src="/brand/vjti-logo.png" alt="VJTI Logo" class="w-full h-full object-contain rounded-full" width="48" height="48" />
    </div>
    <span class="font-mono text-xs uppercase tracking-widest text-[#31D47B]">Authorized Personnel Only</span>
    <h1 class="font-display text-3xl font-black text-[#F4F1E8] mt-1 mb-6">VJTI CRICKET OPS</h1>
    
    <form id="org-login-form" class="space-y-4 text-left">
      <div>
        <label class="block font-mono text-xs text-[#A7B2AC] uppercase mb-1">Email</label>
        <input type="email" required class="w-full bg-[#07100B] border border-white/10 rounded-lg p-3 text-white focus:border-[#31D47B] outline-none" placeholder="organizer@vjti.ac.in" />
      </div>
      <div>
        <label class="block font-mono text-xs text-[#A7B2AC] uppercase mb-1">Password</label>
        <input type="password" required class="w-full bg-[#07100B] border border-white/10 rounded-lg p-3 text-white focus:border-[#31D47B] outline-none" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn-primary w-full py-3 mt-4">AUTHENTICATE →</button>
    </form>

    <div class="mt-4 p-3 bg-white/5 border border-white/10 rounded-lg text-left">
      <p class="font-mono text-[10px] uppercase text-[#31D47B] tracking-wider font-bold">Committee Demo Access:</p>
      <p class="font-mono text-xs text-[#A7B2AC] mt-0.5">Email: <span class="text-white">admin@vjti.ac.in</span></p>
      <p class="font-mono text-xs text-[#A7B2AC]">Password: <span class="text-white">vjti2026</span></p>
    </div>

    <a href="/" class="block mt-6 font-mono text-xs text-[#64716A] hover:text-white">← Return to public site</a>
  </div>

  <script type="module" src="/src/js/organizer/login.js"></script>
</body>
</html>
