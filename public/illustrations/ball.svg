    <line x1="25" y1="56" x2="31" y2="64" />
    <line x1="39" y1="56" x2="45" y2="64" />
    <line x1="53" y1="56" x2="59" y2="64" />
    <line x1="67" y1="56" x2="73" y2="64" />
    <line x1="81" y1="56" x2="87" y2="64" />
    <line x1="95" y1="56" x2="101" y2="64" />
  </g>
</svg>
