    <!-- Handle -->
    <rect x="56" y="10" width="8" height="30" rx="3" fill="#159957" />
    <line x1="56" y1="18" x2="64" y2="18" stroke="#F4F1E8" stroke-width="1.5" />
    <line x1="56" y1="26" x2="64" y2="26" stroke="#F4F1E8" stroke-width="1.5" />
